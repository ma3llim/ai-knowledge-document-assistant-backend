spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${PG_URL}
    username: ${PG_USER}
    password: ${PG_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  jpa:
    hibernate:
      ddl-auto: update

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024

    model:
      embedding: none
      image: none
      chat: none
      moderation: none
      audio:
        speech: none
        transcription: none

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5500

  jwt:
    issuer: ${JWT_ISSUER}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
    oauth-login-code-expiration: ${JWT_OAUTH_LOGIN_CODE_EXPIRATION}

  cookie:
    access-token-name: access_token
    refresh-token-name: refresh_token
    secure: ${COOKIE_SECURE}
    http-only: true
    same-site: ${COOKIE_SAME_SITE}
    path: /

  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}

  processing:
    chunk-size: 1000
    chunk-overlap: 200

  embedding:
    jina:
      api-key: ${JINA_API_KEY}
      base-url: https://api.jina.ai
      model: jina-embeddings-v4

  sqs:
    document-processing-queue: document-processing-queue
    document-summary-queue: document-summary-queue

  rag:
    retrieval:
      similarity-threshold: 0.70
      top-k: 5

  query-specifier:
    cloudflare:
      api-key: ${CLOUDFLARE_QUERY_SPECIFIER_API_KEY}
      base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_QUERY_SPECIFIER_ACCOUNT_ID}/ai
      model: "@cf/meta/llama-3.1-8b-instruct-fast"

  summarization:
    api-key: ${CLOUDFLARE_QUERY_SUMMARIZATION_API_KEY}
    base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_QUERY_SUMMARIZATION_ACCOUNT_ID}/ai
    model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    temperature: 0.2
    max-tokens: 200

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG