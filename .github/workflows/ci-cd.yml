name: AI Knowledge Document Assistant Backend

on:
    push:
        branches:
            - master

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v2

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Grant execute permission
              run: chmod +x gradlew

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Build application
              run: ./gradlew clean bootJar

            - name: Debug GitHub OIDC token
              shell: bash
              run: |
                  TOKEN=$(curl -sS \
                      -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
                      | jq -r '.value')

                  PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

                  echo "OIDC issuer:"
                  echo "$PAYLOAD" | jq -r '.iss'

                  echo "OIDC subject:"
                  echo "$PAYLOAD" | jq -r '.sub'

                  echo "OIDC audience:"
                  echo "$PAYLOAD" | jq -r '.aud'

                  echo "GitHub repository:"
                  echo "$PAYLOAD" | jq -r '.repository'

                  echo "GitHub ref:"
                  echo "$PAYLOAD" | jq -r '.ref'

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker image
              run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

            - name: Tag Docker image
              run: docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            - name: Push Docker image to Amazon ECR
              run: docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            - name: Deploy to EC2
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

                  aws ssm send-command \
                    --region "${AWS_REGION}" \
                    --instance-ids "${EC2_INSTANCE_ID}" \
                    --document-name "AWS-RunShellScript" \
                    --parameters "commands=[
                      \"aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
                      \"sudo docker pull ${IMAGE_URI}\",
                      \"sudo docker stop ai-knowledge-document-assistant || true\",
                      \"sudo docker rm ai-knowledge-document-assistant || true\",
                      \"sudo docker run -d --name ai-knowledge-document-assistant --env-file /opt/ai-knowledge/.env -p 8081:8080 ${IMAGE_URI}\",
                      \"sudo docker image prune -f\"
                    ]"
