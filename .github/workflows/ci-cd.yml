name: AI Knowledge Document Assistant Backend- CI/CD

on:
    push:
        branches:
            - master

permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: ap-south-2
    LAMBDA_FUNCTION_NAME: ai-knowledge-document-assistant

jobs:
    build-and-deploy:
        name: Build and Deploy Backend
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v2

            - name: Setup Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Grant execute permission
              run: chmod +x gradlew

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Build application
              run: ./gradlew clean bootJar

            - name: Prepare Lambda package
              run: |
                  mkdir -p build/lambda
                  cp build/libs/*.jar build/lambda/application.jar

            - name: Get OIDC subject
              shell: bash
              run: |
                  TOKEN=$(curl -sSf \
                      -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
                      | jq -r '.value')

                  echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_id, repository_owner, repository_owner_id, environment}'

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy Lambda
              uses: aws-actions/aws-lambda-deploy@v1.1.0
              with:
                  function-name: ${{ env.LAMBDA_FUNCTION_NAME }}
                  code-artifacts-dir: build/lambda
                  handler: org.aiknowledge.aws.StreamLambdaHandler::handleRequest
                  runtime: java21
                  publish: true
