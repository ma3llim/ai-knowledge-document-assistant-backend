name: AI Knowledge Document Assistant Backend

on:
    push:
        branches:
            - master

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ${{ vars.AWS_REGION }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Scan for secrets
              uses: gitleaks/gitleaks-action@v2

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Grant execute permission
              run: chmod +x gradlew

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Build application
              run: ./gradlew clean bootJar

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker image
              run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

            - name: Tag Docker image
              run: docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            - name: Push Docker image to Amazon ECR
              run: docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            - name: Deploy to EC2
              shell: bash
              run: |
                  ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

                  COMMAND_ID=$(aws ssm send-command \
                      --region "${AWS_REGION}" \
                      --instance-ids "${EC2_INSTANCE_ID}" \
                      --document-name "AWS-RunShellScript" \
                      --parameters "commands=[
                      \"set -e\",
                      \"aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
                      \"sudo docker pull ${IMAGE_URI}\",
                      \"sudo docker stop ai-knowledge-document-assistant || true\",
                      \"sudo docker rm ai-knowledge-document-assistant || true\",
                      \"sudo docker run -d --name ai-knowledge-document-assistant --env-file /opt/ai-knowledge/.env -p 8081:8080 ${IMAGE_URI}\",
                      \"sudo docker image ls ${ECR_REGISTRY}/${ECR_REPOSITORY} --format '{{.ID}} {{.Tag}}' | awk '\$2 != \\\"${{ github.sha }}\\\" {print \$1}' | sort -u | xargs -r sudo docker rmi || true\",
                      \"sudo docker ps --filter name=ai-knowledge-document-assistant\"
                      ]" \
                      --query "Command.CommandId" \
                      --output text)

                  echo "SSM Command ID: ${COMMAND_ID}"

                  aws ssm wait command-executed \
                      --region "${AWS_REGION}" \
                      --command-id "${COMMAND_ID}" \
                      --instance-id "${EC2_INSTANCE_ID}"

                  aws ssm get-command-invocation \
                      --region "${AWS_REGION}" \
                      --command-id "${COMMAND_ID}" \
                      --instance-id "${EC2_INSTANCE_ID}"
