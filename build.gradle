plugins {
    id 'application'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.1.8")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}
dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // model mapper
    implementation 'org.modelmapper:modelmapper:3.2.6'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Postgresql
    runtimeOnly 'org.postgresql:postgresql'
    // OAuth
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // AWS SDK
    implementation 'software.amazon.awssdk:aws-sdk-java:2.54.13'
    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.4.0")
    implementation "io.awspring.cloud:spring-cloud-aws-starter-sqs"
    // Spring AI
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // Spring AI PDF Reader
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    // Pg Vector
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.hibernate.orm:hibernate-vector:6.6.22.Final'
    // Websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Lombok for tests
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}
